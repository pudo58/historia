[project]
name = "historia"
version = "0.1.0"
description = "Historia: local studio that drives RunPod ComfyUI (Qwen-Image, Wan 2.2) to make history films"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "huggingface_hub>=0.27,<2",
  "asyncssh>=2.14,<3",
  "cryptography>=48,<51",
  "fastapi>=0.115,<1",
  "keyring>=25,<26",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "PyYAML>=6.0,<7",
  "pypdf>=5.9,<6",
  "Pillow>=11,<13",
  "av>=16,<17",
  "imageio-ffmpeg>=0.6,<0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
vv = "vv.cli:app"
ghm = "ghm.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
